<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>像素钓鱼</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// --- Config ---
const LOGIC_W = 180;
const LOGIC_H = 320;
let scale = 1;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  scale = Math.min(canvas.width / LOGIC_W, canvas.height / LOGIC_H);
}
resize();
window.addEventListener('resize', resize);

// --- Input ---
let pressing = false;
let pressStart = 0;

canvas.addEventListener('touchstart', e => { e.preventDefault(); pressing = true; pressStart = Date.now(); handlePress(); }, { passive: false });
canvas.addEventListener('touchend', e => { e.preventDefault(); pressing = false; handleRelease(); }, { passive: false });
canvas.addEventListener('mousedown', e => { pressing = true; pressStart = Date.now(); handlePress(); });
canvas.addEventListener('mouseup', e => { pressing = false; handleRelease(); });

// --- Audio ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playTone(freq, duration, type = 'square', vol = 0.15) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}
function sfxCast() { playTone(300, 0.1); setTimeout(() => playTone(200, 0.15), 100); }
function sfxBite() { playTone(800, 0.08); setTimeout(() => playTone(1000, 0.08), 80); setTimeout(() => playTone(1200, 0.06), 160); }
function sfxCatch() { playTone(523, 0.1); setTimeout(() => playTone(659, 0.1), 100); setTimeout(() => playTone(784, 0.15), 200); }
function sfxFail() { playTone(200, 0.2, 'sawtooth'); setTimeout(() => playTone(150, 0.3, 'sawtooth'), 200); }
function sfxClick() { playTone(600, 0.05); }

// --- Fish Data ---
const FISH = [
  { name: '鲫鱼', rarity: 'common', difficulty: 1, minSize: 15, maxSize: 35, color: '#c8a860', speed: 0.8, pattern: 'smooth' },
  { name: '鲤鱼', rarity: 'common', difficulty: 1.2, minSize: 25, maxSize: 55, color: '#e07040', speed: 1.0, pattern: 'smooth' },
  { name: '草鱼', rarity: 'common', difficulty: 1.5, minSize: 30, maxSize: 70, color: '#60a060', speed: 1.2, pattern: 'smooth' },
  { name: '鲈鱼', rarity: 'uncommon', difficulty: 2, minSize: 20, maxSize: 50, color: '#70b070', speed: 1.4, pattern: 'mixed' },
  { name: '鲶鱼', rarity: 'uncommon', difficulty: 2.5, minSize: 35, maxSize: 80, color: '#606080', speed: 1.6, pattern: 'dart' },
  { name: '金鱼', rarity: 'rare', difficulty: 2, minSize: 8, maxSize: 15, color: '#ffaa00', speed: 1.8, pattern: 'dart' },
  { name: '河豚', rarity: 'rare', difficulty: 3, minSize: 12, maxSize: 25, color: '#f0e080', speed: 2.0, pattern: 'dart' },
  { name: '锦鲤', rarity: 'rare', difficulty: 2.5, minSize: 30, maxSize: 60, color: '#ff6060', speed: 1.7, pattern: 'mixed' },
  { name: '龙鱼', rarity: 'legendary', difficulty: 3.5, minSize: 40, maxSize: 90, color: '#ffd700', speed: 2.5, pattern: 'dart' },
  { name: '神秘古鱼', rarity: 'legendary', difficulty: 4, minSize: 50, maxSize: 120, color: '#a040ff', speed: 3.0, pattern: 'mixed' },
];

const RARITY_COLORS = { common: '#aaaaaa', uncommon: '#55cc55', rare: '#5599ff', legendary: '#ffaa00' };
const RARITY_NAMES = { common: '普通', uncommon: '稀有', rare: '珍稀', legendary: '传说' };

// --- Game State ---
let state = 'title';
let castPower = 0;
let castDistance = 0;
let waitTimer = 0;
let biteTimer = 0;
let biting = false;
let currentFish = null;
let currentFishSize = 0;

// Minigame state
let barY = 0;
let barVel = 0;
let barHeight = 60;
let fishY = 0;
let fishVel = 0;
let fishTarget = 0;
let fishTimer = 0;
let progress = 0.3;
let minigameTime = 0;
const BAR_TOP = 40;
const BAR_BOTTOM = 280;
const BAR_ZONE_H = BAR_BOTTOM - BAR_TOP;

// Results & collection
let caughtFish = [];
let collection = {};
let totalCaught = 0;
let showCollection = false;
let collectionScroll = 0;

// Particles
let particles = [];

// Water animation
let waterTime = 0;

// Bobber
let bobberX = 0;
let bobberY = 0;

// --- Helpers ---
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

function pickFish(distance) {
  const normalized = distance / 100;
  let pool = [];
  FISH.forEach(f => {
    let weight = 1;
    if (f.rarity === 'common') weight = 40;
    else if (f.rarity === 'uncommon') weight = 20 + normalized * 10;
    else if (f.rarity === 'rare') weight = 5 + normalized * 15;
    else if (f.rarity === 'legendary') weight = normalized * 5;
    for (let i = 0; i < weight; i++) pool.push(f);
  });
  return pool[randInt(0, pool.length - 1)];
}

function addParticle(x, y, color, count = 5) {
  for (let i = 0; i < count; i++) {
    particles.push({ x, y, vx: rand(-2, 2), vy: rand(-3, -0.5), life: 1, color, size: rand(2, 4) });
  }
}

function vibrate(ms) {
  if (navigator.vibrate) navigator.vibrate(ms);
}

// --- State Handlers ---
function handlePress() {
  if (audioCtx.state === 'suspended') audioCtx.resume();

  if (state === 'title') {
    state = 'idle';
    sfxClick();
  } else if (state === 'idle') {
    if (showCollection) return;
    state = 'casting';
    castPower = 0;
  } else if (state === 'waiting' && biting) {
    startMinigame();
    sfxClick();
  } else if (state === 'result') {
    state = 'idle';
    sfxClick();
  }
}

function handleRelease() {
  if (state === 'casting') {
    castDistance = castPower;
    bobberX = LOGIC_W / 2 + rand(-20, 20);
    bobberY = 100 + (1 - castPower / 100) * 40;
    state = 'waiting';
    waitTimer = rand(2, 6);
    biting = false;
    biteTimer = 1.5;
    sfxCast();
  }
}

function startMinigame() {
  state = 'minigame';
  currentFish = pickFish(castDistance);
  currentFishSize = rand(currentFish.minSize, currentFish.maxSize);
  // Stardew-style: larger catch zone, scales with difficulty but stays generous
  barHeight = Math.max(50, 100 - currentFish.difficulty * 10);
  barY = (BAR_ZONE_H - barHeight) / 2;
  barVel = 0;
  fishY = BAR_ZONE_H / 2;
  fishVel = 0;
  fishTarget = rand(0, BAR_ZONE_H - 10);
  fishTimer = 0;
  minigameTime = 0;
  // Start at 30% — gives breathing room before failure
  progress = 0.3;
}

// --- Update ---
function update(dt) {
  waterTime += dt;
  particles = particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= dt * 2;
    return p.life > 0;
  });

  if (state === 'casting') {
    castPower += dt * 120;
    if (castPower >= 100) castPower = 100;
  }

  if (state === 'waiting') {
    if (!biting) {
      waitTimer -= dt;
      if (waitTimer <= 0) {
        biting = true;
        biteTimer = 1.5;
        sfxBite();
        vibrate(200);
      }
    } else {
      biteTimer -= dt;
      if (biteTimer <= 0) {
        state = 'idle';
        biting = false;
      }
    }
  }

  if (state === 'minigame') {
    minigameTime += dt;

    // Bar physics — responsive controls, Stardew-style bounce
    if (pressing) {
      barVel -= dt * 650;
    } else {
      barVel += dt * 500;
    }
    barVel *= 0.91;
    barY += barVel * dt;
    // Bounce off top/bottom like Stardew (soft bounce, not hard stop)
    if (barY < 0) { barY = 0; barVel = Math.abs(barVel) * 0.35; }
    if (barY > BAR_ZONE_H - barHeight) { barY = BAR_ZONE_H - barHeight; barVel = -Math.abs(barVel) * 0.35; }

    // Fish AI — Stardew style: fish pauses between movements, slower overall
    fishTimer -= dt;
    if (fishTimer <= 0) {
      if (currentFish.pattern === 'smooth') {
        fishTarget = rand(10, BAR_ZONE_H - 20);
        fishTimer = rand(1.5, 3.5);
      } else if (currentFish.pattern === 'dart') {
        fishTarget = rand(5, BAR_ZONE_H - 15);
        fishTimer = rand(0.6, 1.8);
      } else {
        fishTarget = rand(5, BAR_ZONE_H - 15);
        fishTimer = rand(0.8, 2.2);
        if (Math.random() < 0.25) fishTimer = rand(0.3, 0.7);
      }
    }

    // Fish movement — gradual acceleration toward target, not instant
    const fishSpeed = currentFish.speed * 50;
    const fishDist = fishTarget - fishY;
    const fishAccel = Math.sign(fishDist) * Math.min(Math.abs(fishDist), fishSpeed * dt);
    fishY += fishAccel;
    fishY = Math.max(0, Math.min(BAR_ZONE_H - 10, fishY));

    // Progress — Stardew style: fills slowly, drains even slower
    // This makes the minigame last 15-30 seconds typically
    const fishCenter = fishY + 5;
    const inZone = fishCenter >= barY && fishCenter <= barY + barHeight;
    if (inZone) {
      progress += dt * 0.045;
    } else {
      // Drain is slower than fill — forgiving like Stardew
      progress -= dt * (0.025 + currentFish.difficulty * 0.008);
    }
    // Progress can't drop below 0, floor at 0
    progress = Math.max(0, Math.min(1, progress));

    if (progress >= 1) {
      state = 'result';
      caughtFish.unshift({ ...currentFish, size: Math.round(currentFishSize) });
      if (!collection[currentFish.name]) collection[currentFish.name] = { fish: currentFish, best: 0, count: 0 };
      collection[currentFish.name].count++;
      if (currentFishSize > collection[currentFish.name].best) collection[currentFish.name].best = Math.round(currentFishSize);
      totalCaught++;
      sfxCatch();
      vibrate(100);
      addParticle(LOGIC_W / 2, LOGIC_H / 2, '#ffdd00', 15);
    } else if (progress <= 0) {
      state = 'result';
      currentFish = null;
      sfxFail();
      vibrate([50, 50, 50]);
    }
  }
}

// --- Render ---
function drawPixelText(text, x, y, size = 1, color = '#fff', align = 'left') {
  ctx.fillStyle = color;
  ctx.font = `${size * 8}px monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = 'top';
  ctx.fillText(text, x, y);
}

function drawRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), Math.ceil(w), Math.ceil(h));
}

function drawWater(yStart) {
  for (let y = yStart; y < LOGIC_H; y += 2) {
    const depth = (y - yStart) / (LOGIC_H - yStart);
    const r = Math.floor(lerp(60, 20, depth));
    const g = Math.floor(lerp(140, 60, depth));
    const b = Math.floor(lerp(200, 140, depth));
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(0, y, LOGIC_W, 2);
  }
  // Wave highlights
  for (let x = 0; x < LOGIC_W; x += 12) {
    const waveY = yStart + Math.sin(waterTime * 2 + x * 0.3) * 2;
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(x, waveY, 8, 1);
  }
}

function drawSky() {
  for (let y = 0; y < 90; y += 2) {
    const t = y / 90;
    const r = Math.floor(lerp(80, 140, t));
    const g = Math.floor(lerp(120, 180, t));
    const b = Math.floor(lerp(200, 220, t));
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(0, y, LOGIC_W, 2);
  }
  // Clouds
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillRect(20 + Math.sin(waterTime * 0.2) * 5, 15, 20, 6);
  ctx.fillRect(25 + Math.sin(waterTime * 0.2) * 5, 12, 12, 4);
  ctx.fillRect(120 + Math.cos(waterTime * 0.15) * 3, 25, 16, 5);
}

function drawGround() {
  ctx.fillStyle = '#4a7a3a';
  ctx.fillRect(0, 85, LOGIC_W, 10);
  ctx.fillStyle = '#3a6a2a';
  ctx.fillRect(0, 90, LOGIC_W, 5);
}

function drawBobber() {
  const bobY = bobberY + Math.sin(waterTime * 3) * (biting ? 4 : 1);
  ctx.fillStyle = '#ff3030';
  ctx.fillRect(bobberX - 2, bobY - 4, 4, 4);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(bobberX - 2, bobY, 4, 3);
  ctx.fillStyle = '#333';
  ctx.fillRect(bobberX, bobY + 3, 1, 4);
}

function drawFishIcon(x, y, color, size = 1) {
  const s = size;
  ctx.fillStyle = color;
  ctx.fillRect(x - 4*s, y - 2*s, 8*s, 4*s);
  ctx.fillRect(x - 5*s, y - 1*s, 1*s, 2*s);
  ctx.fillRect(x + 4*s, y - 3*s, 2*s, 6*s);
  ctx.fillStyle = '#000';
  ctx.fillRect(x - 2*s, y - 1*s, 1*s, 1*s);
}

function render() {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.restore();

  ctx.save();
  const offsetX = (canvas.width - LOGIC_W * scale) / 2;
  const offsetY = (canvas.height - LOGIC_H * scale) / 2;
  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);
  ctx.imageSmoothingEnabled = false;

  if (state === 'title') {
    drawSky();
    drawGround();
    drawWater(95);
    drawPixelText('像素钓鱼', LOGIC_W/2, 60, 2.5, '#fff', 'center');
    drawPixelText('Pixel Fishing', LOGIC_W/2, 85, 1, '#aaccff', 'center');

    const btnY = 180;
    drawRect(LOGIC_W/2 - 40, btnY, 80, 28, '#3a7a4a');
    drawRect(LOGIC_W/2 - 38, btnY + 2, 76, 24, '#4a9a5a');
    drawPixelText('开始钓鱼', LOGIC_W/2, btnY + 8, 1.2, '#fff', 'center');

    drawFishIcon(40, 250, '#e07040', 1.5);
    drawFishIcon(140, 260, '#60a060', 1.2);
    drawFishIcon(90, 270, '#ffaa00', 1);

    drawPixelText('点击屏幕开始', LOGIC_W/2, 295, 0.8, '#888', 'center');
  }

  else if (state === 'idle' || state === 'casting' || state === 'waiting') {
    drawSky();
    drawGround();
    drawWater(95);

    // Character (simple pixel person)
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(25, 72, 6, 12); // body
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(26, 66, 4, 6); // head
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(31, 74, 12, 1); // rod
    ctx.fillRect(43, 74, 1, 20); // rod vertical

    if (state === 'casting') {
      // Power bar
      drawRect(LOGIC_W/2 - 30, 20, 60, 12, '#333');
      drawRect(LOGIC_W/2 - 28, 22, 56 * (castPower/100), 8, castPower > 80 ? '#ff4444' : '#44cc44');
      drawPixelText('蓄力中...', LOGIC_W/2, 6, 0.8, '#fff', 'center');
    }

    if (state === 'waiting') {
      // Fishing line
      ctx.strokeStyle = '#aaa';
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(43, 94);
      ctx.lineTo(bobberX, bobberY);
      ctx.stroke();
      drawBobber();

      if (biting) {
        drawPixelText('!', bobberX + 5, bobberY - 15, 2, '#ff0');
        drawPixelText('快点击!', LOGIC_W/2, 40, 1.2, '#ff4444', 'center');
      } else {
        drawPixelText('等待中...', LOGIC_W/2, 40, 0.8, '#aaa', 'center');
      }
    }

    if (state === 'idle') {
      drawPixelText('长按屏幕抛竿', LOGIC_W/2, 40, 1, '#fff', 'center');

      // Collection button
      drawRect(LOGIC_W - 36, 4, 32, 16, '#335');
      drawPixelText('图鉴', LOGIC_W - 20, 7, 0.8, '#adf', 'center');
      drawPixelText(`已钓: ${totalCaught}`, 4, 4, 0.7, '#ccc', 'left');
    }

    // Show collection overlay
    if (showCollection) {
      drawRect(5, 5, LOGIC_W - 10, LOGIC_H - 10, 'rgba(10,10,30,0.95)');
      drawPixelText('鱼类图鉴', LOGIC_W/2, 12, 1.5, '#fff', 'center');
      drawPixelText('点击返回', LOGIC_W/2, LOGIC_H - 18, 0.7, '#888', 'center');

      let yy = 35;
      FISH.forEach((f, i) => {
        const caught = collection[f.name];
        const rowY = yy + i * 26;
        if (rowY > LOGIC_H - 30) return;

        if (caught) {
          drawFishIcon(20, rowY + 6, f.color);
          drawPixelText(f.name, 35, rowY, 0.9, '#fff');
          drawPixelText(`${RARITY_NAMES[f.rarity]}`, 35, rowY + 10, 0.6, RARITY_COLORS[f.rarity]);
          drawPixelText(`最大: ${caught.best}cm x${caught.count}`, LOGIC_W - 10, rowY + 4, 0.6, '#aaa', 'right');
        } else {
          drawPixelText('???', 35, rowY + 2, 0.9, '#555');
          drawPixelText(`${RARITY_NAMES[f.rarity]}`, 35, rowY + 12, 0.6, '#444');
        }
      });
    }
  }

  else if (state === 'minigame') {
    drawRect(0, 0, LOGIC_W, LOGIC_H, '#1a2a3a');

    // Fishing bar background
    const barX = LOGIC_W / 2 - 15;
    drawRect(barX, BAR_TOP - 2, 30, BAR_ZONE_H + 4, '#222');
    drawRect(barX + 2, BAR_TOP, 26, BAR_ZONE_H, '#334');

    // Catch zone (green bar)
    const zoneColor = pressing ? '#4ae04a' : '#3ab03a';
    drawRect(barX + 2, BAR_TOP + barY, 26, barHeight, zoneColor);
    drawRect(barX + 2, BAR_TOP + barY, 26, 2, '#6f6');
    drawRect(barX + 2, BAR_TOP + barY + barHeight - 2, 26, 2, '#282');

    // Fish icon in bar
    drawFishIcon(LOGIC_W/2, BAR_TOP + fishY + 5, currentFish.color, 1.2);

    // Progress bar
    drawRect(barX - 20, BAR_TOP, 8, BAR_ZONE_H, '#222');
    const progH = BAR_ZONE_H * progress;
    const progColor = progress > 0.6 ? '#4a4' : progress > 0.3 ? '#aa4' : '#a44';
    drawRect(barX - 18, BAR_TOP + BAR_ZONE_H - progH, 4, progH, progColor);

    // Fish info
    drawPixelText(currentFish.name, LOGIC_W/2, 8, 1.2, RARITY_COLORS[currentFish.rarity], 'center');
    drawPixelText(RARITY_NAMES[currentFish.rarity], LOGIC_W/2, 22, 0.7, '#888', 'center');

    // Timer display
    const timeStr = Math.floor(minigameTime) + 's';
    drawPixelText(timeStr, LOGIC_W - 10, 10, 0.7, '#666', 'right');

    // Instructions
    drawPixelText('按住=上升 松开=下落', LOGIC_W/2, LOGIC_H - 25, 0.7, '#666', 'center');
    drawPixelText('让鱼保持在绿色区域内', LOGIC_W/2, LOGIC_H - 14, 0.7, '#666', 'center');
  }

  else if (state === 'result') {
    drawRect(0, 0, LOGIC_W, LOGIC_H, 'rgba(10,10,30,0.95)');

    if (currentFish) {
      drawPixelText('钓到了!', LOGIC_W/2, 40, 2, '#ffdd00', 'center');
      drawFishIcon(LOGIC_W/2, 100, currentFish.color, 3);
      drawPixelText(currentFish.name, LOGIC_W/2, 130, 1.8, '#fff', 'center');
      drawPixelText(`${RARITY_NAMES[currentFish.rarity]}`, LOGIC_W/2, 155, 1, RARITY_COLORS[currentFish.rarity], 'center');
      drawPixelText(`${Math.round(currentFishSize)} cm`, LOGIC_W/2, 175, 1.2, '#aaa', 'center');

      if (collection[currentFish.name] && collection[currentFish.name].count === 1) {
        drawPixelText('新发现!', LOGIC_W/2, 200, 1, '#ff8800', 'center');
      }
    } else {
      drawPixelText('鱼跑了...', LOGIC_W/2, 80, 1.8, '#ff4444', 'center');
      drawPixelText('下次加油!', LOGIC_W/2, 120, 1, '#888', 'center');
    }

    drawPixelText('点击继续', LOGIC_W/2, LOGIC_H - 30, 1, '#888', 'center');
  }

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    drawRect(p.x, p.y, p.size, p.size, p.color);
  });
  ctx.globalAlpha = 1;

  ctx.restore();
}

// --- Collection toggle via touch position ---
canvas.addEventListener('click', e => {
  if (state === 'idle') {
    const rect = canvas.getBoundingClientRect();
    const offsetX = (canvas.width - LOGIC_W * scale) / 2;
    const offsetY = (canvas.height - LOGIC_H * scale) / 2;
    const x = (e.clientX - rect.left - offsetX) / scale;
    const y = (e.clientY - rect.top - offsetY) / scale;

    if (showCollection) {
      showCollection = false;
      return;
    }
    if (x > LOGIC_W - 40 && y < 24) {
      showCollection = true;
      sfxClick();
    }
  }
});

// --- Game Loop ---
let lastTime = performance.now();
function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
